[project]
name = "wuzhiqi"
version = "0.1.0"
description = "AlphaZero-style Gomoku project"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.7",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
